name: Fork Build APK

# 本 fork 专用：自动构建 APK（已移除中国大陆地区使用限制）。
# - debug   ：applicationId 带 .debug 后缀，便于与官方版共存 / 调试
# - release ：R8 优化 + 每次构建现场自签名，体积更小、在老机型（如 Android 6 电视）上更流畅
#
# 注意：release 签名密钥由 keytool 现场生成、不落库；因此新包覆盖安装前需先卸载旧包
# （签名不同，直接 install -r 会报签名冲突）。

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: fork-build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate signing key
        run: |
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/bv-release.jks \
            -alias bvfork \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bvfork123 -keypass bvfork123 \
            -dname "CN=BV Fork, OU=TV, O=xynu617, L=Shanghai, ST=Shanghai, C=CN"
          cat > signing.properties <<'EOF'
          keystore.path=signing/bv-release.jks
          keystore.pwd=bvfork123
          keystore.alias=bvfork
          keystore.alias_pwd=bvfork123
          EOF

      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace

      - name: Build release APK (signed, R8)
        run: ./gradlew assembleDefaultRelease --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bv-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bv-release-apk
          path: app/build/outputs/apk/default/release/*.apk
          if-no-files-found: error

      - name: Publish APK to rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork-apk
          name: Fork APK (region limit removed)
          body: |
            由 GitHub Actions 自动构建的 APK，已移除「中国大陆地区不可用」限制。

            - `debug`：applicationId 带 `.debug` 后缀，可与官方版共存
            - `release`：R8 优化 + 自签名，体积更小、在老电视（Android 6 / MiTV3S）上更流畅

            > release 签名每次构建现场生成；覆盖安装前需先卸载旧版（签名不同会冲突）。
          prerelease: true
          files: |
            app/build/outputs/apk/default/debug/*.apk
            app/build/outputs/apk/default/release/*.apk
          generate_release_notes: false
