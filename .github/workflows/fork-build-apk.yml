name: Fork Build APK

# 本 fork 专用：自动构建 debug APK（已移除中国大陆地区使用限制）。
# 上游的 alpha/release workflow 带 `if: github.repository == 'aaa1115910/bv'`
# 守卫，在 fork 里不会出包；这里补一条不依赖任何仓库 Secret 的构建流水线。

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: fork-build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bv-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork-apk
          name: Fork debug APK (region limit removed)
          body: |
            由 GitHub Actions 自动构建的 debug APK，已移除「中国大陆地区不可用」限制。

            - 安装包为 debug 签名，可与官方版共存（applicationId 带 `.debug` 后缀）
            - 每次 push 到 develop 都会重新构建并更新本 Release 的安装包
          prerelease: true
          files: app/build/outputs/apk/default/debug/*.apk
          generate_release_notes: false
